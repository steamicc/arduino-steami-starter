name: suivre-image

on:
  schedule:
    - cron: "47 6 * * *"
  workflow_dispatch:

# Le jeton du workflow ne sert qu'à lire : la branche et la PR sont ouvertes
# par l'App (jeton « app » ci-dessous), ce qui déclenche « compiler ».
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: suivre-image
  cancel-in-progress: false

jobs:
  suivre:
    # Sans cette condition, chaque dépôt d'élève (créé depuis ce modèle)
    # exécuterait ce suivi tous les jours.
    if: github.repository == 'steamicc/arduino-steami-starter'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Jeton de l'App
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_SECRET }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ steps.app.outputs.token }}
      - name: Chercher une image plus récente
        id: image
        env:
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          set -euo pipefail
          nouvelle=$(git ls-remote --tags https://github.com/steamicc/arduino-steami-devcontainer.git 'refs/tags/devcontainer-*' \
            | python3 .github/scripts/suivre_image.py .devcontainer/devcontainer.json)
          echo "nouvelle=$nouvelle" >> "$GITHUB_OUTPUT"
          if [ -z "$nouvelle" ]; then echo "Image à jour."; exit 0; fi
          branche="chore/image-$nouvelle"
          echo "branche=$branche" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --heads origin "$branche" >/dev/null 2>&1 \
            || [ -n "$(gh pr list --head "$branche" --state all --json number,author,isCrossRepository --jq '.[] | select((.isCrossRepository | not) and .author.login == "app/'"$APP_SLUG"'") | .number')" ]; then
            echo "La branche ou la PR $branche existe déjà."
            echo "deja=oui" >> "$GITHUB_OUTPUT"
          fi
      - name: Vérifier que l'image est publiée
        id: publiee
        if: steps.image.outputs.nouvelle != ''
        env:
          NOUVELLE: ${{ steps.image.outputs.nouvelle }}
        run: |
          set -euo pipefail
          sortie="$RUNNER_TEMP/sortie"
          if docker manifest inspect "ghcr.io/steamicc/arduino-steami-devcontainer:$NOUVELLE" >/dev/null 2>"$sortie"; then
            echo "publiee=oui" >> "$GITHUB_OUTPUT"
          elif grep -qiE "manifest unknown|name unknown" "$sortie"; then
            echo "::notice::image $NOUVELLE pas encore publiée : le prochain lancement ouvrira la PR"
            echo "publiee=non" >> "$GITHUB_OUTPUT"
          else
            echo "::error::registre illisible : $(cat "$sortie")"
            exit 1
          fi
      - name: Ouvrir la PR
        if: steps.publiee.outputs.publiee == 'oui' && steps.image.outputs.deja != 'oui'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          NOUVELLE: ${{ steps.image.outputs.nouvelle }}
          BRANCHE: ${{ steps.image.outputs.branche }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          set -euo pipefail
          sed -i -E "s#(arduino-steami-devcontainer:)[0-9]{4}\.[0-9]{2}\.[0-9]+#\1$NOUVELLE#" .devcontainer/devcontainer.json
          git diff --quiet && { echo "✗ rien à modifier"; exit 1; }
          id_bot=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${id_bot}+${APP_SLUG}[bot]@users.noreply.github.com"
          git switch -c "$BRANCHE"
          git commit -am "chore: passer à l'image $NOUVELLE"
          git push origin "$BRANCHE"
          gh pr create --base "${{ github.event.repository.default_branch }}" --head "$BRANCHE" \
            --title "chore: passer à l'image $NOUVELLE" \
            --body "Nouvelle image du Codespace : [devcontainer-$NOUVELLE](https://github.com/steamicc/arduino-steami-devcontainer/releases/tag/devcontainer-$NOUVELLE) (\`ghcr.io/steamicc/arduino-steami-devcontainer:$NOUVELLE\`).

          Le workflow \`compiler\` (qui lit la version dans \`.devcontainer/devcontainer.json\`) vérifie cette branche. La PR se fusionne seule dès qu'il est vert.

          À vérifier avant de fusionner : \`platformio.ini\` doit rester identique à \`.devcontainer/source/amorcage/platformio.ini\` de l'image (le copier si besoin)."
      - name: Activer la fusion automatique
        if: steps.publiee.outputs.publiee == 'oui'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BRANCHE: ${{ steps.image.outputs.branche }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          DEFAUT: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # Seule la PR du robot, venue de ce dépôt, est concernée (jamais une PR de fork).
          # Liste sans recherche (pas de --author) : l'index de recherche retarde
          # sur la création de la PR, faite quelques secondes plus tôt.
          num=$(gh pr list --head "$BRANCHE" --state open --json number,author,isCrossRepository \
            --jq '[.[] | select((.isCrossRepository | not) and .author.login == "app/'"$APP_SLUG"'") | .number] | first // empty')
          if [ -z "$num" ]; then
            echo "::warning::aucune PR ouverte du robot pour $BRANCHE : à fusionner à la main"
            exit 0
          fi
          exigee=$(gh api "repos/$GH_REPO/rules/branches/$DEFAUT" \
            --jq '[.[] | select(.type=="required_status_checks") | .parameters.required_status_checks[].context] | index("compiler") != null')
          if [ "$exigee" != "true" ]; then
            echo "::warning::le check « compiler » n'est pas exigé sur $DEFAUT : la PR #$num est à fusionner à la main"
            exit 0
          fi
          # Défense en profondeur : si l'App peut contourner la règle, la fusion
          # automatique n'attendrait pas « compiler ».
          # Seuls les rulesets qui exigent un check comptent : l'App contourne
          # légitimement le ruleset d'organisation (suppression, historique).
          ids=$(gh api "repos/$GH_REPO/rules/branches/$DEFAUT" \
            --jq '[.[] | select(.type=="required_status_checks") | .ruleset_id] | unique | .[]')
          if [ -z "$ids" ]; then
            echo "::warning::aucun ruleset n'exige de check sur $DEFAUT : la PR #$num est à fusionner à la main"
            exit 0
          fi
          for id in $ids; do
            peut=$(gh api "repos/$GH_REPO/rulesets/$id" --jq '.current_user_can_bypass // "inconnu"')
            if [ "$peut" != "never" ]; then
              echo "::warning::l'App peut contourner le ruleset $id ($peut) : fusion automatique refusée, la PR #$num est à fusionner à la main"
              exit 0
            fi
          done
          gh pr merge "$num" --auto --squash
