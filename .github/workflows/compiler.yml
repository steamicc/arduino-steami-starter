name: compiler

on:
  push:
    branches: [main]
  pull_request:
  # Gardé pour les lancements à la main.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  image:
    # Sans cette condition, chaque dépôt d'élève (créé depuis ce modèle)
    # recevrait un courriel d'échec à chaque sauvegarde d'un programme en cours.
    if: github.repository == 'steamicc/arduino-steami-starter'
    runs-on: ubuntu-latest
    outputs:
      etiquette: ${{ steps.lire.outputs.etiquette }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Une seule source pour la version de l'image : .devcontainer/devcontainer.json
      # (le suivi automatique ne modifie que ce fichier).
      - id: lire
        run: |
          etiquette=$(python3 -c 'import json; print(json.load(open(".devcontainer/devcontainer.json"))["image"].rsplit(":", 1)[1])')
          [[ "$etiquette" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]+$ ]] || { echo "✗ étiquette d'image inattendue : $etiquette"; exit 1; }
          echo "etiquette=$etiquette" >> "$GITHUB_OUTPUT"
  compiler:
    needs: image
    # Un check obligatoire sauté compte comme réussi : « compiler » tourne donc
    # même si « image » échoue ou est annulé, et échoue alors explicitement
    # (première étape) : always() et non !cancelled(), sinon une annulation
    # pendant « image » sauterait « compiler » et laisserait passer la PR.
    # Le dépôt modèle seulement : les dépôts d'élèves sautent « image » comme
    # « compiler ».
    if: ${{ always() && github.repository == 'steamicc/arduino-steami-starter' }}
    runs-on: ubuntu-latest
    container:
      # Image minimale quand « image » a échoué, pour que la première étape
      # puisse rapporter l'erreur.
      image: ${{ needs.image.result == 'success' && format('ghcr.io/steamicc/arduino-steami-devcontainer:{0}', needs.image.outputs.etiquette) || 'alpine:3.20' }}
    steps:
      - name: Exiger que « image » ait réussi
        if: needs.image.result != 'success'
        env:
          RESULTAT: ${{ needs.image.result }}
        run: |
          echo "::error::le job « image » n'a pas réussi ($RESULTAT) : rien n'est compilé"
          exit 1
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Tester la garde du tuteur IA
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Compiler le programme
        run: steami-compiler
      - name: Vérifier le binaire
        run: test -s .steami/firmware.bin
