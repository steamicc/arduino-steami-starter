[platformio]
boards_dir = /opt/steami/boards

[env:steami]
; STM32duino 3.1.0, le core qu'installe l'Arduino IDE pour la carte STeaMi
; (le core 2.x plafonnait requestFrom() à 255 octets, trop peu pour le pont DAPLink).
platform = ststm32@20.0.0
platform_packages = platformio/framework-arduinoststm32@4.30100.0
board = steami
framework = arduino
monitor_speed = 115200
lib_extra_dirs = /opt/steami/libs
